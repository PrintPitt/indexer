# Entitas indexer FotokopiKilat. Nominal token dalam satuan terkecil tIDRX (2 desimal: Rp1 = 100).

enum StatusOrder {
  Open
  Claimed
  Siap
  Finished
  Expired
  Sengketa
  Diputuskan
}

enum AlasanExpire {
  Antre
  Kerja
}

type Order {
  id: ID!
  pelanggan: Pelanggan!
  jenis: Int!
  label: String!
  harga: BigInt!
  halaman: Int!
  batasKerja: Int!
  "Hash dokumen terenkripsi (kosong = mode demo tanpa dokumen)"
  dokumen: String
  "Order butuh serah terima QR (kodeHash != 0)"
  pakaiKode: Boolean!
  teks: String!
  status: StatusOrder! @index
  sesi: Sesi!
  toko: Toko
  langkahSelesai: Int!
  dibuatPada: BigInt! @index
  diclaimPada: BigInt
  siapPada: BigInt
  selesaiPada: BigInt
  "Payout yang terkunci saat Siap"
  payoutTerkunci: BigInt
  "true = diserahkan lewat QR / tanpa kode; false = ditutup setelah batas jemput"
  diserahkan: Boolean
  kerja: Int
  "Payout bersih ke toko (setelah fee platform)"
  payout: BigInt
  feePlatform: BigInt
  refund: BigInt
  alasanExpire: AlasanExpire
  "Sengketa ditutup otomatis (50/50) karena operator tidak memutuskan sampai batas waktu"
  diputuskanOtomatis: Boolean
  viaRelayer: Boolean!
  relayer: String
  feeRelay: BigInt
  txBuat: String!
}

type Toko {
  id: ID!
  nama: String!
  orders: [Order!]! @derivedFrom(field: "toko")
  diclaim: Int!
  selesai: Int!
  gagal: Int!
  sengketa: Int!
  totalPayout: BigInt!
  "Toko Pro aktif sampai (detik); null = belum pernah langganan"
  proSampai: BigInt
}

type Sesi {
  id: ID!
  nomor: Int!
  aktif: Boolean!
  mulai: BigInt!
  berakhir: BigInt
  orders: [Order!]! @derivedFrom(field: "sesi")
  omzet: [OmzetSesi!]! @derivedFrom(field: "sesi")
  jumlahOrder: Int!
  volume: BigInt!
}

# Leaderboard: omzet satu toko dalam satu sesi (sama dengan mapping `omzet` di contract). id = "<sesi>-<toko>".
type OmzetSesi {
  id: ID!
  sesi: Sesi!
  toko: Toko!
  omzet: BigInt! @index
  selesai: Int!
}

type Pelanggan {
  id: ID!
  orders: [Order!]! @derivedFrom(field: "pelanggan")
  jumlahOrder: Int!
  totalBayar: BigInt!
  totalRefund: BigInt!
  nft: Int!
  totalTopUp: BigInt!
}

# Mint tIDRX (Transfer dari alamat nol) = top-up yang sudah masuk.
type TopUp {
  id: ID!
  ke: String! @index
  jumlah: BigInt!
  waktu: BigInt!
  tx: String!
}

type Katalog {
  id: ID!
  hargaDasar: BigInt!
  hargaPerHalaman: BigInt!
  batasDasar: Int!
  batasPerHalaman: Int!
  jumlahLangkah: Int!
  label: String!
}

# Satu baris per chain, id "global".
type Statistik {
  id: ID!
  sesiAktif: Int!
  feeRelay: BigInt!
  order: Int!
  selesai: Int!
  expired: Int!
  sengketa: Int!
  relayed: Int!
  volume: BigInt!
  payout: BigInt!
  refund: BigInt!
  topUp: BigInt!
  platformFeeBps: Int!
  pendapatanFee: BigInt!
  pendapatanPro: BigInt!
}
