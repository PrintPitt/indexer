# FotokopiKilat indexer entities. Token amounts are in the smallest tIDRX unit (2 decimals: Rp1 = 100).

enum StatusOrder {
  Open
  Claimed
  Siap
  Finished
  Expired
  Sengketa
  Diputuskan
}

enum AlasanExpire {
  Antre
  Kerja
}

type Order {
  id: ID!
  pelanggan: Pelanggan!
  jenis: Int!
  label: String!
  harga: BigInt!
  halaman: Int!
  batasKerja: Int!
  "Encrypted document hash (empty = demo mode without a document)"
  dokumen: String
  "Order requires a QR handover (kodeHash != 0)"
  pakaiKode: Boolean!
  teks: String!
  status: StatusOrder! @index
  sesi: Sesi!
  toko: Toko
  langkahSelesai: Int!
  dibuatPada: BigInt! @index
  diclaimPada: BigInt
  siapPada: BigInt
  selesaiPada: BigInt
  "Payout locked when the order became Siap (ready)"
  payoutTerkunci: BigInt
  "true = handed over via QR / without a code; false = closed after the pickup deadline"
  diserahkan: Boolean
  kerja: Int
  "Net payout to the shop (after the platform fee)"
  payout: BigInt
  feePlatform: BigInt
  refund: BigInt
  alasanExpire: AlasanExpire
  "Dispute closed automatically (50/50) because the operator did not decide before the deadline"
  diputuskanOtomatis: Boolean
  viaRelayer: Boolean!
  relayer: String
  feeRelay: BigInt
  txBuat: String!
}

type Toko {
  id: ID!
  nama: String!
  "false if disabled by the operator (cannot claim)"
  aktif: Boolean!
  orders: [Order!]! @derivedFrom(field: "toko")
  diclaim: Int!
  selesai: Int!
  gagal: Int!
  sengketa: Int!
  totalPayout: BigInt!
  "Toko Pro active until (seconds); null = never subscribed"
  proSampai: BigInt
}

type Sesi {
  id: ID!
  nomor: Int!
  aktif: Boolean!
  mulai: BigInt!
  berakhir: BigInt
  orders: [Order!]! @derivedFrom(field: "sesi")
  omzet: [OmzetSesi!]! @derivedFrom(field: "sesi")
  jumlahOrder: Int!
  volume: BigInt!
}

# Leaderboard: one shop's revenue in one session (same as the contract's `omzet` mapping). id = "<sesi>-<toko>".
type OmzetSesi {
  id: ID!
  sesi: Sesi!
  toko: Toko!
  omzet: BigInt! @index
  selesai: Int!
}

type Pelanggan {
  id: ID!
  orders: [Order!]! @derivedFrom(field: "pelanggan")
  jumlahOrder: Int!
  totalBayar: BigInt!
  totalRefund: BigInt!
  nft: Int!
  totalTopUp: BigInt!
}

# tIDRX mint (Transfer from the zero address) = a completed top-up.
type TopUp {
  id: ID!
  ke: String! @index
  jumlah: BigInt!
  waktu: BigInt!
  tx: String!
}

type Katalog {
  id: ID!
  hargaDasar: BigInt!
  hargaPerHalaman: BigInt!
  batasDasar: Int!
  batasPerHalaman: Int!
  jumlahLangkah: Int!
  label: String!
}

# One row per chain, id "global".
type Statistik {
  id: ID!
  sesiAktif: Int!
  feeRelay: BigInt!
  order: Int!
  selesai: Int!
  expired: Int!
  sengketa: Int!
  relayed: Int!
  volume: BigInt!
  payout: BigInt!
  refund: BigInt!
  topUp: BigInt!
  platformFeeBps: Int!
  pendapatanFee: BigInt!
  pendapatanPro: BigInt!
}
