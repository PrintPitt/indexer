# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# FotokopiKilat indexer (BLZ-20, D-16). Live game events still go over a WebSocket straight to the RPC;
# this indexer serves the snapshot when the FE opens, order history, the per-session revenue leaderboard and tIDRX top-ups.
# ABIs in ./abis are written by script/export.mjs in the PrintPitt/contracts repo.
name: fotokopi-kilat
description: Orders, shops, sessions, customers and tIDRX top-ups
# Per-chain entities: the same id on 10143 and 31337 is two different rows.
disable_default_cross_chain: true
# block.number and block.timestamp are always present; the tx hash is used for explorer links.
field_selection:
  transaction_fields: [hash]
contracts:
  - name: FotokopiKilat
    abi_file_path: ./abis/FotokopiKilat.json
    events:
      - event: KatalogSet
      - event: ShopRegistered
      - event: ShopRenamed
      - event: ShopStatusSet
      - event: SessionStarted
      - event: SessionEnded
      - event: FeeRelaySet
      - event: PlatformSet
      - event: PlatformFeeTaken
      - event: ProSubscribed
      - event: OrderCreated
      - event: OrderDetail
      - event: OrderRelayed
      - event: OrderClaimed
      - event: StepCompleted
      - event: OrderReady
      - event: OrderFinished
      - event: OrderExpired
      - event: OrderDisputed
      - event: DisputeResolved
  - name: TestIDRX
    abi_file_path: ./abis/TestIDRX.json
    events:
      - event: Transfer
chains:
  # Monad testnet via HyperSync (https://10143.hypersync.xyz), needs ENVIO_API_TOKEN.
  # Default = the 2026-10-24 deploy (deployments/10143.json in the contracts repo); ENVIO_* env vars override it.
  - id: 10143
    start_block: ${ENVIO_START_BLOCK:-73752547}
    contracts:
      - name: FotokopiKilat
        address: "${ENVIO_FK_ADDRESS:-0x24b045E3B4155232F81c709dF3DD43595a5C5101}"
      - name: TestIDRX
        address: "${ENVIO_TIDRX_ADDRESS:-0xcCf26C3b02a610fB87327f41a13384aF8ff57F45}"
  # Local anvil: deterministic addresses from test/uji-anvil.sh in the backend repo (deployer key #0, nonces 0 and 1).
  - id: 31337
    start_block: 0
    rpc:
      - url: ${ENVIO_ANVIL_RPC:-http://127.0.0.1:8545}
        for: sync
    contracts:
      - name: FotokopiKilat
        address: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      - name: TestIDRX
        address: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
